<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>T-CORE Google ログイン</title>
<style>body{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;background:#f5f6f8;color:#1d2433;margin:0;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #dde1e8;border-radius:10px;padding:24px 28px;max-width:420px;line-height:1.7}</style></head>
<body><div class="box"><b>T-CORE</b><div id="m">Google のログイン結果を T-CORE に渡しています…</div></div>
<script>
// Google のログイン画面から戻ってくるページ。受け取った許可（アクセストークン）を、同じサイトで開いている T-CORE に渡して閉じる。
// トークンは画面にもアドレスにも残さない（すぐにアドレスから消す）。
(function () {
  var p = new URLSearchParams((location.hash || "").replace(/^#/, "")), msg = { type: "tcore-gauth", state: p.get("state") || "", access_token: p.get("access_token") || "", expires_in: p.get("expires_in") || "", error: p.get("error") || "" };
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  var sent = false;
  try { var bc = new BroadcastChannel("tcore-gauth"); bc.postMessage(msg); bc.close(); sent = true; } catch (e) {}
  try { localStorage.setItem("tcore.gauth", JSON.stringify(msg)); setTimeout(function () { try { localStorage.removeItem("tcore.gauth"); } catch (e) {} }, 3000); sent = true; } catch (e) {}
  document.getElementById("m").textContent = msg.error ? "Google の許可が得られませんでした（" + msg.error + "）。このウィンドウを閉じて、T-CORE でもう一度操作してください。" : sent ? "ログインしました。T-CORE に戻ってください（このウィンドウは自動で閉じます）。" : "T-CORE に結果を渡せませんでした。このウィンドウを閉じて、もう一度操作してください。";
  if (!msg.error && sent) setTimeout(function () { window.close(); }, 600);
})();
</script></body></html>
