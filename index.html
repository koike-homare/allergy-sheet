  const snapDoc = (path) => { const has = cache.has(path), v = cache.get(path); return { id: path.split("/").pop(), exists: has, data: () => (has ? JSON.parse(v) : undefined), metadata: {} }; };
  const snapColl = (coll) => ({ docs: [...cache.keys()].filter((p) => collOf(p) === coll).sort().map(snapDoc) });
  const fire = (path) => {
    for (const cb of docSubs.get(path) || []) try { cb(snapDoc(path)); } catch (_) {}
    const c = collOf(path); if (!loaded.has(c)) return;
    for (const cb of collSubs.get(c) || []) try { cb(snapColl(c)); } catch (_) {}
  };
  const apply = (path, data) => { // 変化があったときだけ知らせる（自分の保存がサーバーから返ってきた分は無視される）
    const next = data == null ? null : JSON.stringify(unpack(data)), had = cache.has(path);
    if (next === null) { if (!had) return; cache.delete(path); } else { if (had && cache.get(path) === next) return; cache.set(path, next); }
    fire(path);
  };
  const dbErr = (error) => fail(error && (error.code === "42501" || error.status === 401 || error.status === 403) ? "permission_denied" : "unavailable", error && error.message);
  async function loadColl(coll) {
    const { data, error } = await sb.from("docs").select("path,data").eq("coll", coll);
    if (error) throw dbErr(error);
    const seen = new Set(data.map((r) => r.path));
    for (const p of [...cache.keys()]) if (collOf(p) === coll && !seen.has(p)) cache.delete(p);
    for (const r of data) cache.set(r.path, JSON.stringify(unpack(r.data)));
    loaded.add(coll);
    for (const cb of collSubs.get(coll) || []) try { cb(snapColl(coll)); } catch (_) {}
    for (const [p, set] of docSubs) if (collOf(p) === coll) for (const cb of set) try { cb(snapDoc(p)); } catch (_) {}
  }
  async function loadDoc(path) {
    const { data, error } = await sb.from("docs").select("data").eq("path", path).maybeSingle();
    if (error) throw dbErr(error);
    if (data) cache.set(path, JSON.stringify(unpack(data.data))); else cache.delete(path);
  }
  const sub = (map, key, cb) => { if (!map.has(key)) map.set(key, new Set()); map.get(key).add(cb); return () => map.get(key) && map.get(key).delete(cb); };
  const db = {
    doc: (path) => ({
      get: async () => { await loadDoc(path); return snapDoc(path); },
      set: async (obj) => {
        const { error } = await sb.from("docs").upsert({ path, coll: collOf(path), data: pack(obj), updated_at: new Date().toISOString() });
        if (error) throw dbErr(error);
        apply(path, obj);
      },
      delete: async () => { const { error } = await sb.from("docs").delete().eq("path", path); if (error) throw dbErr(error); apply(path, null); },
      onSnapshot: (cb, onErr) => { const off = sub(docSubs, path, cb); loadDoc(path).then(() => cb(snapDoc(path)), (e) => onErr && onErr(e)); return off; },
    }),
    collection: (coll) => ({
      onSnapshot: (cb, onErr) => { const off = sub(collSubs, coll, cb); loadColl(coll).catch((e) => onErr && onErr(e)); return off; },
    }),
  };

  /* ほかの人の変更を受け取る。通信が切れていた間の分は、つながり直したときと画面に戻ったときに読み直す。 */
  let chan = null, lastSync = 0;
  const resync = () => { lastSync = Date.now(); for (const c of loaded) loadColl(c).catch(() => {}); for (const p of docSubs.keys()) if (!loaded.has(collOf(p))) loadDoc(p).then(() => fire(p), () => {}); };
  function startRealtime() {
    stopRealtime(); let joined = false;
    chan = sb.channel("docs-changes").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, (m) => {
      if (m.eventType === "DELETE") apply(m.old.path, null); else apply(m.new.path, m.new.data);
    }).subscribe((status) => { if (status === "SUBSCRIBED") { if (joined) resync(); joined = true; } });
  }
  function stopRealtime() { if (chan) { try { sb.removeChannel(chan); } catch (_) {} chan = null; } }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && chan && Date.now() - lastSync > 60000) resync(); });

  /* AI：画像は長辺1568pxまでのJPEGにして送る。 */
  async function toJpeg(blob) {
    try {
      const bmp = await createImageBitmap(blob), k = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
      const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(bmp.width * k)); cv.height = Math.max(1, Math.round(bmp.height * k));
      cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
      const url = cv.toDataURL("image/jpeg", 0.85);
      return { media_type: "image/jpeg", data: url.slice(url.indexOf(",") + 1) };
    } catch (_) { throw fail("image_rejected"); }
  }
  async function ask(prompt, opts) {
    opts = opts || {};
    const images = []; for (const b of opts.images || []) images.push(await toJpeg(b));
    const { data: s } = await sb.auth.getSession(); if (!s || !s.session) throw fail("session_expired");
    let res;
    try {
      res = await fetch(CFG.url + "/functions/v1/ai", { method: "POST", signal: opts.signal, headers: { "Content-Type": "application/json", apikey: CFG.key, Authorization: "Bearer " + s.session.access_token }, body: JSON.stringify({ prompt, images }) });
    } catch (e) { throw fail(e && e.name === "AbortError" ? "cancelled" : "upstream_error"); }
    let body = null; try { body = await res.json(); } catch (_) {}
    if (!res.ok) throw fail((body && body.code) || (res.status === 401 ? "session_expired" : res.status === 429 ? "rate_limited" : "upstream_error"));
    return String((body && body.text) || "");
  }
  const sample = {
    limits: async () => ({ images: { maxCount: 4 } }),
    text: (prompt, opts) => ask(prompt, opts),
    json: async (prompt, opts) => {
      const t = await ask(prompt, opts), a = t.indexOf("{"), b = t.lastIndexOf("}");
      try { return JSON.parse(t.slice(a, b + 1)); } catch (_) { throw fail("invalid_json"); }
    },
  };
  const downloads = {
    save: async ({ filename, data }) => {
      const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return { status: "saved" };
    },
  };
  const caps = { db, sample, downloads, user: { can: async () => true } };
  window.claude = {
    use: async (name) => caps[name] || null,
    host: {
      /** true=成功 / false=パスワード違い / "error"=通信できない */
      signIn: async (pw) => {
        try {
          const { error } = await sb.auth.signInWithPassword({ email: CFG.email, password: pw });
          if (error) return error.status === 400 || error.code === "invalid_credentials" ? false : "error";
          startRealtime(); lastSync = Date.now(); return true;
        } catch (_) { return "error"; }
      },
      changePassword: async (pw) => { try { const { error } = await sb.auth.updateUser({ password: pw }); return !error; } catch (_) { return false; } },
/** 特定原材料の自動確認を今すぐ始める（結果は settings/specwatch に書かれ、画面に届く）。 */
      checkSpec: async () => {
        try {
          const { data: se } = await sb.auth.getSession(); if (!se || !se.session) return false;
          const r = await fetch(CFG.url + "/functions/v1/spec-watch", { method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.key, Authorization: "Bearer " + se.session.access_token }, body: "{}" });
          return r.ok;
        } catch (_) { return false; }
      },
      signOut: async () => { stopRealtime(); cache.clear(); loaded.clear(); try { await sb.auth.signOut(); } catch (_) {} },
    },
  };
})();
</script>

.sug button{text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 10px;color:var(--ink);cursor:pointer;font-size:13px}
.sug button:last-child{border-bottom:0}
.sug button:hover,.sug button:focus-visible{background:var(--accent-soft);color:var(--accent)}
div.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.nlist{max-height:60vh;overflow-y:auto;border:1px solid var(--line);border-radius:4px}
.nrow{display:flex;gap:6px;align-items:center;padding:3px 6px;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:0}
.nrow input{border-color:transparent;background:transparent}
.nrow input:hover{border-color:var(--line)}
.slist{display:flex;flex-direction:column;gap:2px}
.slist button{text-align:left;background:none;border:0;border-radius:4px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer}
.slist button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.erow{display:grid;grid-template-columns:110px 150px 110px 110px 1fr 120px 1fr 36px;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.erow.head{font-size:12px;color:var(--muted);padding:0 0 4px}
.erow .lab{display:none;font-size:11px;color:var(--muted)}
@media (min-width:821px){.etable{min-width:900px}}
@media (max-width:820px){.erow.head{display:none}.erow{grid-template-columns:1fr 1fr}.erow .lab{display:block}}
/* ダイアログ */
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0;width:min(1000px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,15,25,.5)}
.dlg{display:flex;flex-direction:column;gap:14px;padding:18px}
/* 読み取り結果の確認：右端をドラッグして横幅を変えられる */
.dlg-grip{position:absolute;top:0;right:0;bottom:0;width:12px;cursor:ew-resize;touch-action:none;display:flex;align-items:center;justify-content:center}
.dlg-grip::after{content:"";width:4px;height:44px;border-radius:4px;background:var(--line)}
.dlg-grip:hover::after,.dlg-grip.drag::after{background:var(--accent)}
table.prev{border-collapse:collapse;font-size:12.5px;width:100%}
table.prev th,table.prev td{border:1px solid var(--line);padding:4px 6px;vertical-align:top;white-space:pre-wrap;min-width:70px}
table.prev th{background:var(--sunken);font-weight:400}
table.prev tr.hd td{background:var(--accent-soft)}
table.rv td{padding:3px;white-space:normal}
table.rv input,table.rv select,table.rv textarea{font-size:12.5px;padding:3px 5px}
table.rv td:nth-child(2){width:84px} table.rv td:nth-child(3){width:64px} table.rv td:nth-child(4){width:130px} table.rv td:nth-child(5){width:22%} table.rv td:nth-child(6){width:72px} table.rv td:nth-child(7){width:20%}
table.prev select{font-size:12px;padding:2px 4px;min-width:96px}
/* 読み取り結果の確認：1行入力とプルダウンの高さをそろえる */
table.rv input:not([type=checkbox]),table.rv select{font-size:12.5px;padding:3px 5px;height:32px;box-sizing:border-box;min-width:0}
table.rv textarea{min-height:32px;box-sizing:border-box;padding:5px;display:block}
.fields input:not([type=checkbox]),.fields select,#rv-group{height:36px;box-sizing:border-box}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;max-width:calc(100vw - 32px);z-index:10}

/* ---------- バックアップ（書き出し・読み込み） ----------
   全データを1つのファイルにまとめる。中身はログイン用パスワードの鍵で暗号化し、読み込み時はそのファイルを作ったときのパスワードを入力する。 */
async function sealWith(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return { iv: b64(iv), ct: b64(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify(obj)))) };
}

      const out = { app: "allergy-sheet", v: 1, exportedAt: new Date().toISOString(), auth: authDoc, counts: { cases: payload.cases.length, stores: payload.stores.length, courses: payload.courses.length }, ...(await sealWith(dataKey, payload)) };
      await dl.save({ filename: `アレルギー対応シート_バックアップ_${today().replace(/-/g, "")}.json`, data: JSON.stringify(out) });
      say(`書き出しました（案件${payload.cases.length}件、店舗${payload.stores.length}件、コース${payload.courses.length}件）。`, true);
    } catch (e) { say(e && e.code === "declined" ? "" : "書き出せませんでした。"); }
  };
  file.addEventListener("change", async () => {
    const f = file.files[0]; file.value = ""; if (!f) return;
    try { pending = JSON.parse(await f.text()); if (pending.app !== "allergy-sheet" || !pending.ct || !pending.auth) throw 0; bkPending = pending; } catch (_) { pending = bkPending = null; return say("このアプリのバックアップファイルではありません。"); }
    const k = pending.counts || {};
    say(`読み込むファイル：${(pending.exportedAt || "").slice(0, 10)} 作成、案件${k.cases ?? "?"}件・店舗${k.stores ?? "?"}件・コース${k.courses ?? "?"}件。そのファイルを作ったときのログイン用パスワードを入力して「読み込みを実行」を押してください。`, true);
    step2.hidden = false; pw.focus();
  });
  const run = async () => {
    pending = pending || bkPending; if (!pending) return;
    say("読み込み中…", true);
    try {
      const raw = await unwrapKey(pw.value, pending.auth); if (!raw) return say("パスワードが違います。");
      const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
      const data = JSON.parse(td.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(pending.iv) }, key, unb64(pending.ct))));
      const put = async (path, body) => { const b = clone(body); delete b.id; await db.doc(path).set(b); };
      for (const x of data.stores || []) await put("stores/" + x.id, x);
      for (const x of data.courses || []) await put("courses/" + x.id, x);
      if (data.settings) await put("settings/common", { ...data.settings, editedBy: "restore" });
      if (data.approval) await put("settings/approval", data.approval);
      if (data.approval && Array.isArray(data.approval.stamps)) S.approvers = data.approval.stamps;
      for (const x of data.cases || []) { const b = clone(x); delete b.id; b.updatedAt = b.updatedAt || new Date().toISOString(); b.editedBy = "restore"; await db.doc("cases/" + x.id).set(await seal(b)); }
      pending = bkPending = null; pw.value = ""; step2.hidden = true; if ($("#bk-run")) $("#bk-run").parentNode.hidden = true; setDraft = null;
      say(`読み込みました（案件${(data.cases || []).length}件、店舗${(data.stores || []).length}件、コース${(data.courses || []).length}件）。`, true); toast("バックアップを読み込みました");

  return h("div", { class: "panel stack", id: "backup" }, h("h3", { text: "バックアップ" }),
    h("div", { class: "muted small", text: "案件・店舗・コース成分表・共通設定のすべてを1つのファイルに書き出します。ファイルの中身は暗号化され、読み込みには書き出した時点のログイン用パスワードが必要です。読み込むと、同じ案件・店舗・コースは上書きされ、共通設定はファイルの内容に置き換わります。" }),
    h("div", { class: "row" },
      dl ? h("button", { type: "button", class: "btn", id: "bk-export", text: "バックアップを書き出す", onclick: doExport }) : null,
      db && !readOnly ? h("button", { type: "button", class: "btn", id: "bk-import", text: "バックアップを読み込む", onclick: () => file.click() }) : null, file),
    step2, msg);
}
function backupPanelNote(el) { if (bkNote) { const m = el.querySelector("#bk-msg"); m.textContent = bkNote[0]; m.style.color = bkNote[1] ? "var(--ok)" : "var(--bad)"; } return el; }
/** 上長承認のパスワードの変更。現在のパスワードを確かめてから、新しいハッシュに置き換える（承認者の名前はそのまま）。 */
function apPwPanel() {
  const cur = pwInput("ap-cur", "off"), n1 = pwInput("ap-n1", "off"), n2 = pwInput("ap-n2", "off");
  const msg = h("span", { class: "small" });
  const say = (t, ok) => { msg.textContent = t; msg.style.color = ok ? "var(--ok)" : "var(--bad)"; };
  return h("form", { class: "panel stack", id: "ap-panel", onsubmit: async (e) => {
    e.preventDefault();
    if (n1.value.length < 4) return say("新しいパスワードは4文字以上にしてください。");
    if (n1.value !== n2.value) return say("確認用のパスワードが一致しません。");
    try {
      const a = await getApproval();
      if (a && a.hash && (await apHash(a.salt || "", cur.value)) !== a.hash) return say("現在の上長パスワードが違います。");
      const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
      await db.doc("settings/approval").set({ ...(a ? clone(a) : { stamps: ["小池", "竹坂"] }), salt, hash: await apHash(salt, n1.value) });
      cur.value = n1.value = n2.value = ""; say("", true); toast("上長パスワードを変更しました");
    } catch (_) { say("変更できませんでした。時間をおいてもう一度お試しください。"); }
  } }, h("h3", { text: "上長パスワードの変更" }),
    h("div", { class: "muted small", text: "案件・コース成分表の承認と、この共通設定を開くときに使うパスワードです。承認者（小池・竹坂）共通で、変更したら承認者に新しいパスワードを伝えてください。" }),
    h("div", { class: "fields" }, field("現在の上長パスワード", withEye(cur)), field("新しい上長パスワード（4文字以上）", withEye(n1)), field("もう一度入力", withEye(n2))),
    h("div", { class: "row" }, h("button", { type: "submit", class: "btn", text: "変更する" }), msg));
}
function pwPanel() {
  const cur = pwInput("pw-cur", "current-password"), n1 = pwInput("pw-n1", "new-password"), n2 = pwInput("pw-n2", "new-password");
  const msg = h("span", { class: "small" });
  const say = (t, ok) => { msg.textContent = t; msg.style.color = ok ? "var(--ok)" : "var(--bad)"; };
  return h("form", { class: "panel stack", onsubmit: async (e) => {
    e.preventDefault();
    if (n1.value.length < 8) return say("新しいパスワードは8文字以上にしてください。");
    if (n1.value !== n2.value) return say("確認用のパスワードが一致しません。");
    if (!(await unwrapKey(cur.value, authDoc))) return say("現在のパスワードが違います。");
    try {
      const host = window.claude && window.claude.host;
      const a = await wrapKey(n1.value, rawKey); await db.doc("settings/auth").set(a);
      // 単独アプリ：サインイン用のパスワードも同じものに変える。失敗したら鍵を元に戻して、両者が食い違わないようにする。
      if (host && !(await host.changePassword(n1.value))) { await db.doc("settings/auth").set(authDoc); return say("サーバー側のパスワードを変更できませんでした。時間をおいてもう一度お試しください。"); }
      authDoc = a; cur.value = n1.value = n2.value = ""; say("", true); toast("パスワードを変更しました"); }
    catch (_) { say("変更できませんでした。編集権限のあるアカウントで開いてください。"); }
  } }, h("h3", { text: "パスワードの変更" }),
    h("div", { class: "muted small", text: "全員共通のパスワードです。変更したら利用者に新しいパスワードを伝えてください。忘れると保存済みの案件を開けなくなります。" }),
    h("div", { class: "fields" }, field("現在のパスワード", withEye(cur)), field("新しいパスワード（8文字以上）", withEye(n1)), field("もう一度入力", withEye(n2))),
    h("div", { class: "row" }, h("button", { type: "submit", class: "btn", text: "変更する" }), msg));
}
