  const snapDoc = (path) => { const has = cache.has(path), v = cache.get(path); return { id: path.split("/").pop(), exists: has, data: () => (has ? JSON.parse(v) : undefined), metadata: {} }; };
  const snapColl = (coll) => ({ docs: [...cache.keys()].filter((p) => collOf(p) === coll).sort().map(snapDoc) });
  const fire = (path) => {
    for (const cb of docSubs.get(path) || []) try { cb(snapDoc(path)); } catch (_) {}
    const c = collOf(path); if (!loaded.has(c)) return;
    for (const cb of collSubs.get(c) || []) try { cb(snapColl(c)); } catch (_) {}
  };
  const apply = (path, data) => { // 変化があったときだけ知らせる（自分の保存がサーバーから返ってきた分は無視される）
    const next = data == null ? null : JSON.stringify(unpack(data)), had = cache.has(path);
    if (next === null) { if (!had) return; cache.delete(path); } else { if (had && cache.get(path) === next) return; cache.set(path, next); }
    fire(path);
  };
  const dbErr = (error) => fail(error && (error.code === "42501" || error.status === 401 || error.status === 403) ? "permission_denied" : "unavailable", error && error.message);
  async function loadColl(coll) {
    const { data, error } = await sb.from("docs").select("path,data").eq("coll", coll);
    if (error) throw dbErr(error);
    const seen = new Set(data.map((r) => r.path));
    for (const p of [...cache.keys()]) if (collOf(p) === coll && !seen.has(p)) cache.delete(p);
    for (const r of data) cache.set(r.path, JSON.stringify(unpack(r.data)));
    loaded.add(coll);
    for (const cb of collSubs.get(coll) || []) try { cb(snapColl(coll)); } catch (_) {}
    for (const [p, set] of docSubs) if (collOf(p) === coll) for (const cb of set) try { cb(snapDoc(p)); } catch (_) {}
  }
  async function loadDoc(path) {
    const { data, error } = await sb.from("docs").select("data").eq("path", path).maybeSingle();
    if (error) throw dbErr(error);
    if (data) cache.set(path, JSON.stringify(unpack(data.data))); else cache.delete(path);
  }
  const sub = (map, key, cb) => { if (!map.has(key)) map.set(key, new Set()); map.get(key).add(cb); return () => map.get(key) && map.get(key).delete(cb); };
  const db = {
    doc: (path) => ({
      get: async () => { await loadDoc(path); return snapDoc(path); },
      set: async (obj) => {
        const { error } = await sb.from("docs").upsert({ path, coll: collOf(path), data: pack(obj), updated_at: new Date().toISOString() });
        if (error) throw dbErr(error);
        apply(path, obj);
      },
      delete: async () => { const { error } = await sb.from("docs").delete().eq("path", path); if (error) throw dbErr(error); apply(path, null); },
      onSnapshot: (cb, onErr) => { const off = sub(docSubs, path, cb); loadDoc(path).then(() => cb(snapDoc(path)), (e) => onErr && onErr(e)); return off; },
    }),
    collection: (coll) => ({
      onSnapshot: (cb, onErr) => { const off = sub(collSubs, coll, cb); loadColl(coll).catch((e) => onErr && onErr(e)); return off; },
    }),
  };

  /* ほかの人の変更を受け取る。通信が切れていた間の分は、つながり直したときと画面に戻ったときに読み直す。 */
  let chan = null, lastSync = 0;
  const resync = () => { lastSync = Date.now(); for (const c of loaded) loadColl(c).catch(() => {}); for (const p of docSubs.keys()) if (!loaded.has(collOf(p))) loadDoc(p).then(() => fire(p), () => {}); };
  function startRealtime() {
    stopRealtime(); let joined = false;
    chan = sb.channel("docs-changes").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, (m) => {
      if (m.eventType === "DELETE") apply(m.old.path, null); else apply(m.new.path, m.new.data);
    }).subscribe((status) => { if (status === "SUBSCRIBED") { if (joined) resync(); joined = true; } });
  }
  function stopRealtime() { if (chan) { try { sb.removeChannel(chan); } catch (_) {} chan = null; } }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && chan && Date.now() - lastSync > 60000) resync(); });

  /* AI：画像は長辺1568pxまでのJPEGにして送る。 */
  async function toJpeg(blob) {
    try {
      const bmp = await createImageBitmap(blob), k = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
      const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(bmp.width * k)); cv.height = Math.max(1, Math.round(bmp.height * k));
      cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
      const url = cv.toDataURL("image/jpeg", 0.85);
      return { media_type: "image/jpeg", data: url.slice(url.indexOf(",") + 1) };
    } catch (_) { throw fail("image_rejected"); }
  }
  async function ask(prompt, opts) {
    opts = opts || {};
    const images = []; for (const b of opts.images || []) images.push(await toJpeg(b));
    const { data: s } = await sb.auth.getSession(); if (!s || !s.session) throw fail("session_expired");
    let res;
    try {
      res = await fetch(CFG.url + "/functions/v1/ai", { method: "POST", signal: opts.signal, headers: { "Content-Type": "application/json", apikey: CFG.key, Authorization: "Bearer " + s.session.access_token }, body: JSON.stringify({ prompt, images }) });
    } catch (e) { throw fail(e && e.name === "AbortError" ? "cancelled" : "upstream_error"); }
    let body = null; try { body = await res.json(); } catch (_) {}
    if (!res.ok) throw fail((body && body.code) || (res.status === 401 ? "session_expired" : res.status === 429 ? "rate_limited" : "upstream_error"));
    return String((body && body.text) || "");
  }
  const sample = {
    limits: async () => ({ images: { maxCount: 4 } }),
    text: (prompt, opts) => ask(prompt, opts),
    json: async (prompt, opts) => {
      const t = await ask(prompt, opts), a = t.indexOf("{"), b = t.lastIndexOf("}");
      try { return JSON.parse(t.slice(a, b + 1)); } catch (_) { throw fail("invalid_json"); }
    },
  };
  const downloads = {
    save: async ({ filename, data }) => {
      const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return { status: "saved" };
    },
  };
  const caps = { db, sample, downloads, user: { can: async () => true } };
  window.claude = {
    use: async (name) => caps[name] || null,
    host: {
      /** true=成功 / false=パスワード違い / "error"=通信できない */
      signIn: async (pw) => {
        try {
          const { error } = await sb.auth.signInWithPassword({ email: CFG.email, password: pw });
          if (error) return error.status === 400 || error.code === "invalid_credentials" ? false : "error";
          startRealtime(); lastSync = Date.now(); return true;
        } catch (_) { return "error"; }
      },
      changePassword: async (pw) => { try { const { error } = await sb.auth.updateUser({ password: pw }); return !error; } catch (_) { return false; } },
/** 特定原材料の自動確認を今すぐ始める（結果は settings/specwatch に書かれ、画面に届く）。 */
      checkSpec: async () => {
        try {
          const { data: se } = await sb.auth.getSession(); if (!se || !se.session) return false;
          const r = await fetch(CFG.url + "/functions/v1/spec-watch", { method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.key, Authorization: "Bearer " + se.session.access_token }, body: "{}" });
          return r.ok;
        } catch (_) { return false; }
      },
      signOut: async () => { stopRealtime(); cache.clear(); loaded.clear(); try { await sb.auth.signOut(); } catch (_) {} },
    },
  };
})();
</script>

const ROLES = [["", "使わない"], ["kumi", "組"], ["sex", "性別"], ["name", "氏名"], ["allergy", "アレルギー"], ["seibun", "成分可否"], ["remark", "備考"], ["memo", "確認メモ（社内用）"], ["special", "特別対応"]];
const GUESS = [["allergy", /アレルギ|アレルゲン|原因食|食物|除去/], ["name", /氏名|名前|生徒名|お名前/], ["kumi", /組|クラス|学級/], ["sex", /性別|男女/], ["seibun", /成分|可否|コンタミ|微量/], ["remark", /備考|症状|その他|メモ|特記/], ["special", /特別対応/]];
const MARK = /^([○〇◯●✓✔レ有]|あり|1|yes|y)$/i;

const normSex = (v) => (/女|^f/i.test(v) ? "女" : /男|^m/i.test(v) ? "男" : "");
/** AIが読み取った食材ごとの可否を、アレルギー欄の食材名に結び付ける。 */
function sbMapFrom(allergy, each) {
  const tags = parseTags(allergy), out = {};
  for (const e of Array.isArray(each) ? each : []) { const item = String((e && e.item) || "").trim(), v = e && e.value; if (!item || !SEIBUN.includes(v)) continue; const tag = tags.find((x) => x === item) || tags.find((x) => x.includes(item) || item.includes(x)); if (tag) out[tag] = v; }
  return out;
}
/** AIが「食品以外」「料理名」と読み取った言葉を、アレルギー欄の言葉に結び付ける。 */
function kindMapFrom(allergy, nonFood, dishes) {
  const tags = parseTags(allergy), out = {};
  for (const [list, k] of [[nonFood, "nonfood"], [dishes, "dish"]]) for (const w of Array.isArray(list) ? list : []) { const item = String(w || "").trim(); if (!item) continue; const tag = tags.find((x) => x === item) || tags.find((x) => x.includes(item) || item.includes(x)); if (tag && !out[tag]) out[tag] = k; }

}
const normSeibun = (v) => (/不可|×|ng|ダメ|だめ/i.test(v) ? "不可" : /不明|[?？]/.test(v) ? "不明" : /可|○|〇|ok/i.test(v) ? "可" : "");
function gridToPeople(grid, hdr, roles, onlyAllergy) {
  const head = grid[hdr] || [], out = [];
  for (const line of grid.slice(hdr + 1)) {
    const p = { kumi: "", sex: "", name: "", allergy: [], seibun: "", remark: [], special: "" };
    roles.forEach((role, i) => {
      const v = String(line[i] ?? "").trim(); if (!role || !v) return;
      if (role === "allergy") { if (MARK.test(v)) p.allergy.push(String(head[i] || "").trim()); else if (!/^(なし|無し|無|-|―|ー|×|0)$/.test(v)) p.allergy.push(v); }
      else if (role === "remark") p.remark.push(v);
      else if (role === "sex") p.sex = normSex(v);
      else if (role === "seibun") p.seibun = normSeibun(v);
      else p[role] = v;
    });
    const person = { ...p, allergy: p.allergy.join("、"), remark: p.remark.join("\n") };
    if (!person.name && !person.allergy) continue;
    if (onlyAllergy && !person.allergy) continue;
    out.push(person);
  }
  return out;
}

/** 貼り付けられたテキストを表にする。チャットからコピーした表（| 区切り）やコードの囲みにも対応する。 */
function pasteToGrid(raw) {
  const t = raw.replace(/\r/g, "").replace(/^\s*```[a-zA-Z]*\s*$/gm, "").trim();
  const lines = t.split("\n").filter((l) => l.trim());
  if (lines.length && lines.filter((l) => /^\s*\|.*\|\s*$/.test(l)).length >= lines.length * 0.6)
    return lines.filter((l) => /^\s*\|/.test(l) && !/^[\s|:\-]+$/.test(l)).map((l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim().replace(/<br\s*\/?>/gi, "\n")));
  const wb = XLSX.read(t, { type: "string", raw: true, FS: t.includes("\t") ? "\t" : "," });
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "", blankrows: false });
}

  // 初期値：「アレルギー対応者を固める」以外はすべてチェック。依頼文は前回のものを引き継ぐ。
  if (Array.isArray(lay.opts) && !lay.wideInit) { lay.opts.push("wide"); } lay.wideInit = 1; // 「広く使う」は初期状態でチェックあり（以前に作ったレイアウトにも一度だけ入れる）
  if (!Array.isArray(lay.opts)) { lay.opts = [...OPTS.map((o) => o[0]).filter((k) => k !== "altogether"), "wide"]; try { const d = JSON.parse(localStorage.getItem("seatPrompt") || "null"); if (d && !lay.ai) lay.ai = String(d.ai || ""); } catch (_) {} }

  // 詰め方：左右・上下・向きは、それぞれどちらか一方だけ選べる。選んだ組み合わせを1つの文にして指示に入れ、卓もその順に並べて渡す。
  const DIRS = [["wide", "広く使う", ""], ["fromL", "左から詰める", "fromR"], ["fromR", "右から詰める", "fromL"], ["fromT", "上から詰める", "fromB"], ["fromB", "下から詰める", "fromT"], ["dirH", "横向きに詰める", "dirV"], ["dirV", "縦向きに詰める", "dirH"]];

    const hz = lay.opts.includes("fromR") ? "右" : "左", vt = lay.opts.includes("fromB") ? "下" : "上", oh = hz === "左" ? "右" : "左", ov = vt === "上" ? "下" : "上";

  };
  const instruction = () => [...OPTS.filter((o) => lay.opts.includes(o[0])).map((o) => "・" + o[2]), dirText() ? "・" + dirText() : "",
    lay.opts.includes("wide") && OPTS.concat(DIRS.filter((d) => d[2])).some((o) => lay.opts.includes(o[0])) ? "・6名以上の区分は席を広く使う：1つの卓に定員いっぱいまで座らせず、定員より1名少ない人数まで（6名卓なら最大5名）にして卓を分け、人数をできるだけ均等にする（例：6名は3名＋3名、9名は5名＋4名、12名は4名＋4名＋4名）。6名未満の区分は分けずに1卓にまとめる。卓が足りないときだけ、定員まで使ってよい" : "", (lay.ai || "").trim() ? "・" + lay.ai.trim() : ""].filter(Boolean).join("\n");
  const preview = h("div", { class: "small muted", id: "seat-prompt", style: "white-space:pre-wrap" });
  const showPrompt = () => { const t = instruction(); preview.textContent = t ? "AIへ送る指示：\n" + t : "条件が選ばれていないため、AIを使わず標準の並べ方（クラス・男女ごとに卓を分け、職員等は最後）で作成します。"; };
  /** 「アレルギー対応者を固める」のときは、対応者を元の区分から切り出して別の区分にする。 */
  const seatGroups = () => {

  const say = (t, bad) => { msg.textContent = t; msg.style.color = bad ? "var(--bad)" : "var(--ok)"; };

    tb("seat-note", "吹き出しを追加", "選んだマスの近くに吹き出しを追加する（ドラッグで移動、ダブルクリックで文字を修正）", () => { ed.api.snapshot(); const g = ed.api.range(), fl = ed.api.floor(); lay.notes.push({ id: uid("n"), fid: fl.id, x: ed.api.X(g.c1) + 20, y: Math.max(0, ed.api.Y(g.r1) - 40), text: "メモ" }); ch(); ed.api.redraw(); })] });

  const info = () => { const fl = ed.api.floor(); if (!fl) return; const ts = layTables(fl, areaOf()), cap = ts.reduce((n, t) => n + t.cap, 0); areaInfo.textContent = `${areaOf() ? `指定したエリア（${areaOf().length}か所）` : "この階の全体"}：卓 ${ts.length}・席 ${cap}　／　利用人数 ${partyTotal(c.party)}名`; };
  const finish = (fl, tables, plan, note, gs0 = groups) => {
    if (lay.opts.includes("wide")) spreadPlan(tables, plan);
    const lost = applySeating(lay, fl, tables, plan, gs0, c.rows || []);
    const seated = new Map(); for (const gs of plan.values()) for (const g of gs) seated.set(g.key, (seated.get(g.key) || 0) + g.count);
    const short = gs0.filter((g) => (seated.get(g.key) || 0) < g.n).map((g) => `${g.ai || g.label} ${g.n - (seated.get(g.key) || 0)}名`);

  };
  /** アレルギー対応者のうち、年・組・性別が利用人数のどの区分にも当たらない人（このまま作ると、吹き出しが席と結び付かない）。 */
  const mismatches = () => (c.rows || []).filter((r) => (r.name || "").trim() && (r.allergy || "").trim() && !groupOfRow(r, groups)).map((r) => {
    const y = half(r.year || "").trim().replace(/年$/, ""), k = half(r.kumi || "").trim().replace(/組$/, "");
    const cls = (y ? y + "年" : "") + (k ? k + (/\d$/.test(k) ? "組" : "") : ""), sex = r.sex === "男" ? "男子" : r.sex === "女" ? "女子" : "";
    const who = [cls, r.name.trim()].filter(Boolean).join(" ");
    return sex ? `${who} は「${sex}」ですが、利用人数と一致しません` : cls ? `${who} は、利用人数と一致しません` : `${who} は年・組・性別が未入力のため、利用人数のどの区分か特定できません`;
  });
  const run = async (btn, force) => {
    const fl = ed.api.floor(); if (!fl) return;
    if (!groups.length) return say("利用人数が入力されていません。案件画面の「利用人数」に人数を入れてください。", true);
    const bad = force ? [] : mismatches();
    if (bad.length) {
      msg.style.color = ""; msg.replaceChildren(h("div", { class: "seat-warn", id: "seat-warn" },
        h("strong", { text: "条件不一致" }), h("div", { text: bad.map((t) => "・" + t).join("\n") }),

        h("div", { class: "row", style: "gap:8px" },
          h("button", { type: "button", class: "btn sm", id: "seat-go", text: "レイアウト作成を続ける", onclick: () => { msg.replaceChildren(); run(btn, true); } }),

    if (!sample) { ed.api.redraw(); return say("この表示環境ではAIが使えません。条件のチェックと依頼文を空にすると、標準の並べ方で作成できます。", true); }

      const res = await sample.json(`飲食店の団体予約の配席を作ります。卓の一覧と、座る人の区分ごとの人数、担当者からの指示を渡します。指示に従って、どの卓にどの区分を何名座らせるかを決めてください。

${multiA ? "卓には area（配席エリアの番号）がある。エリア1から優先して使い、エリア1に収まらない分だけエリア2（その次はエリア3…）を使う。同じ区分は、できるだけ同じエリアの中にまとめる。エリアをまたいで分けてよいのは、その区分がどのエリアにも入り切らないときだけ。\n" : ""}卓：${JSON.stringify(tables.map((t) => ({ id: t.id, cap: t.cap, row: t.r1 + 1, col: t.c1 + 1, ...(multiA ? { area: (t.ai || 0) + 1 } : {}) })))}
区分：${JSON.stringify(gs.map((g) => ({ key: g.key, name: g.ai || g.label, count: g.n })))}
${allergy.length ? "食物アレルギー対応者のいる区分：" + allergy.join("、") + "\n" : ""}担当者からの指示：
${text}
返答はJSONだけにしてください。形式：{"tables":[{"id":"T1","groups":[{"key":"c1m","count":4}]}],"comment":"指示のうち反映できなかった点があれば一言。なければ空"}`);

    panel, ed].filter(Boolean);

window.addEventListener("dragover", (e) => e.preventDefault());
